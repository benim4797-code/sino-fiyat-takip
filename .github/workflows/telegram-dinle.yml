name: Telegram Dinle

on:
  schedule:
    # 10 dakikada bir yeni mesajları kontrol eder
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiyat-takip
  cancel-in-progress: false

jobs:
  dinle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Yeni mesajları oku
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_ekle.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "fiyat-takip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add urunler.csv telegram_durum.json
          git diff --staged --quiet || git commit -m "Telegram üzerinden ürün güncellemesi"
          git pull --rebase --autostash || true
          git push
